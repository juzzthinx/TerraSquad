<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TerraSquad — Living Art, Designed by You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F4F1EB;
    --ink: #1C1C1A;
    --moss: #4A5540;
    --moss-light: #6B7A5F;
    --sand: #C4AA80;
    --sage: #8A9A7A;
    --border: rgba(28,28,26,0.1);
    --white: #FEFEFE;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--cream); font-family: 'DM Mono', monospace; color: var(--ink); }

  @keyframes wordIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.25; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .float-1 { animation: float 6s ease-in-out infinite; }
  .float-2 { animation: float 6s ease-in-out infinite; animation-delay: -2s; }
  .float-3 { animation: float 6s ease-in-out infinite; animation-delay: -4s; }
  .dot-1 { animation: dotPulse 1.5s ease-in-out infinite; }
  .dot-2 { animation: dotPulse 1.5s ease-in-out infinite; animation-delay: 0.25s; }
  .dot-3 { animation: dotPulse 1.5s ease-in-out infinite; animation-delay: 0.5s; }
  .slide-up { animation: slideUp 0.4s ease forwards; }
  .toast-anim { animation: toastIn 0.3s ease forwards; }
  .fade-in { animation: fadeIn 1s ease forwards; }

  /* Nav */
  .nav {
    position: sticky; top: 0; z-index: 200;
    background: rgba(244,241,235,0.94); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; letter-spacing: 0.06em; }
  .nav-logo em { font-style: italic; color: var(--moss); }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-link {
    background: none; border: none; cursor: pointer;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--moss); font-family: inherit; position: relative; padding-bottom: 2px;
    transition: color 0.2s;
  }
  .nav-link::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: var(--ink); transition: width 0.3s; }
  .nav-link:hover::after { width: 100%; }
  .nav-link:hover { color: var(--ink); }
  .nav-cart {
    background: var(--ink); color: var(--cream); border: none;
    padding: 9px 20px; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer; font-family: inherit;
    transition: background 0.2s;
  }
  .nav-cart:hover { background: var(--moss); }

  /* Hamburger */
  .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; }
  .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--ink); transition: all 0.3s ease; }

  /* Mobile menu */
  .mobile-menu {
    display: none; position: fixed; top: 64px; left: 0; right: 0; z-index: 199;
    background: var(--cream); border-bottom: 1px solid var(--border);
    overflow: hidden; transition: max-height 0.35s ease;
  }
  .mobile-menu a, .mobile-menu button {
    display: block; background: none; border: none; text-decoration: none;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--moss); font-family: inherit; padding: 16px 32px; width: 100%;
    text-align: left; border-bottom: 1px solid rgba(28,28,26,0.06); cursor: pointer;
  }

  /* Hero */
  .hero { max-width: 1200px; margin: 0 auto; padding: 80px 40px 60px; }
  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
  .hero-eyebrow { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sage); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .hero-eyebrow-line { display: inline-block; width: 24px; height: 1px; background: var(--sage); }
  .hero-h1 { font-family: 'Cormorant Garamond', serif; font-size: 62px; font-weight: 300; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 24px; }
  .hero-h1 em { font-style: italic; color: var(--moss); }
  .hero-p { font-size: 12px; line-height: 1.9; color: #666; letter-spacing: 0.04em; max-width: 380px; margin-bottom: 36px; }
  .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-primary { padding: 14px 32px; background: var(--ink); color: var(--cream); border: none; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.25s; }
  .btn-primary:hover { background: var(--moss); transform: translateY(-1px); }
  .btn-outline { padding: 14px 32px; background: transparent; color: var(--ink); border: 1px solid rgba(28,28,26,0.2); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.25s; }
  .btn-outline:hover { background: var(--ink); color: var(--cream); }
  .hero-stats { display: flex; gap: 32px; margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--border); }
  .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; color: #999; text-transform: uppercase; margin-top: 4px; }

  /* Hero visual */
  .hero-visual { position: relative; height: 440px; }
  .hero-card { position: absolute; border-radius: 2px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 24px 64px rgba(0,0,0,0.15); }
  .hero-card-emoji { font-size: 56px; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.3)); transition: transform 0.5s ease; }
  .hero-card:hover .hero-card-emoji { transform: scale(1.08); }
  .hero-card-label { position: absolute; bottom: 12px; left: 12px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(244,241,235,0.8); background: rgba(0,0,0,0.25); padding: 4px 8px; backdrop-filter: blur(4px); }

  /* Divider */
  .divider { display: flex; align-items: center; gap: 16px; padding: 0 40px; max-width: 1200px; margin: 0 auto 60px; }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sand); }

  /* Builder */
  .builder { max-width: 1200px; margin: 0 auto; padding: 0 40px 80px; }
  .section-header { margin-bottom: 48px; }
  .section-h2 { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; margin-bottom: 8px; }
  .section-sub { font-size: 11px; color: #999; letter-spacing: 0.06em; }
  .builder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }

  /* Form */
  .form-block { display: flex; flex-direction: column; gap: 28px; }
  .form-group { display: flex; flex-direction: column; gap: 10px; }
  .form-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--moss); }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 16px; border: 1px solid rgba(28,28,26,0.15); font-family: inherit; font-size: 11px; letter-spacing: 0.06em; cursor: pointer; transition: all 0.2s; background: transparent; color: var(--ink); }
  .chip:hover { border-color: var(--moss); color: var(--moss); }
  .chip.active { background: var(--moss); color: var(--cream); border-color: var(--moss); }
  .form-textarea { padding: 12px 16px; border: 1px solid rgba(28,28,26,0.12); background: #fff; font-family: inherit; font-size: 11px; color: var(--ink); outline: none; resize: none; height: 80px; width: 100%; letter-spacing: 0.02em; transition: border-color 0.2s; }
  .form-textarea:focus { border-color: var(--moss); }
  .generate-btn { padding: 17px 32px; background: var(--ink); color: var(--cream); border: none; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; font-family: inherit; width: 100%; transition: all 0.3s; }
  .generate-btn:hover:not(:disabled) { background: var(--moss); letter-spacing: 0.2em; }
  .generate-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .hint-text { font-size: 10px; color: #bbb; letter-spacing: 0.08em; }

  /* Result panel */
  .result-panel { background: #fff; border: 1px solid var(--border); min-height: 480px; display: flex; flex-direction: column; }
  .result-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .result-title { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--moss); }
  .result-badge { font-size: 9px; color: #bbb; letter-spacing: 0.08em; }
  .result-body { padding: 28px 24px; flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; max-height: 600px; }
  .result-body::-webkit-scrollbar { width: 4px; }
  .result-body::-webkit-scrollbar-thumb { background: var(--border); }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #ccc; text-align: center; padding: 40px 0; }
  .empty-icon { font-size: 48px; opacity: 0.35; }
  .empty-text { font-size: 11px; letter-spacing: 0.08em; line-height: 1.8; max-width: 220px; }
  .loading-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px 0; }
  .loading-dots { display: flex; gap: 7px; }
  .loading-dot { width: 7px; height: 7px; background: var(--moss); border-radius: 50%; }
  .loading-text { font-size: 11px; letter-spacing: 0.12em; color: #aaa; text-transform: uppercase; }
  .error-box { padding: 16px; background: #fff5f5; border: 1px solid #ffcccc; font-size: 11px; color: #c0392b; line-height: 1.7; letter-spacing: 0.03em; }
  .design-name { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; font-style: italic; }
  .design-visual { width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .design-emoji { font-size: 72px; filter: drop-shadow(0 12px 32px rgba(0,0,0,0.2)); }
  .design-tag { position: absolute; bottom: 12px; right: 12px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,241,235,0.9); background: rgba(28,28,26,0.3); padding: 4px 8px; backdrop-filter: blur(4px); }
  .design-desc { font-size: 12px; line-height: 1.9; color: #555; letter-spacing: 0.02em; }
  .plant-list { display: flex; flex-direction: column; gap: 6px; }
  .plant-item { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--cream); }
  .plant-name { font-size: 11px; color: var(--ink); }
  .plant-role { font-size: 10px; color: var(--sage); letter-spacing: 0.06em; }
  .care-tip { padding: 12px 14px; background: #f0f4ec; border-left: 2px solid var(--moss); font-size: 11px; color: var(--moss); line-height: 1.7; letter-spacing: 0.02em; }
  .price-row { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); }
  .price-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 4px; }
  .price-amount { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 300; }
  .action-row { display: flex; gap: 8px; }
  .btn-cart { flex: 1; padding: 13px; background: var(--ink); color: var(--cream); border: none; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: background 0.2s; }
  .btn-cart:hover { background: var(--moss); }
  .btn-save { padding: 13px 20px; background: transparent; color: var(--ink); border: 1px solid rgba(28,28,26,0.15); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .btn-save:hover { background: var(--ink); color: var(--cream); }
  .start-over { background: none; border: none; cursor: pointer; font-size: 10px; letter-spacing: 0.1em; color: #bbb; text-transform: uppercase; font-family: inherit; text-align: center; padding: 4px; width: 100%; transition: color 0.2s; }
  .start-over:hover { color: var(--moss); }

  /* Gallery dark */
  .gallery-section { background: var(--ink); padding: 80px 40px; color: var(--cream); }
  .gallery-inner { max-width: 1200px; margin: 0 auto; }
  .gallery-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 48px; flex-wrap: wrap; gap: 16px; }
  .gallery-h2 { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; margin-bottom: 8px; }
  .gallery-sub { font-size: 11px; color: var(--sand); letter-spacing: 0.06em; }
  .btn-gold { padding: 11px 24px; background: transparent; color: var(--sand); border: 1px solid rgba(196,170,128,0.4); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .btn-gold:hover { background: var(--sand); color: var(--ink); }
  .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .gallery-card { cursor: pointer; }
  .gallery-card-img { aspect-ratio: 3/4; overflow: hidden; margin-bottom: 14px; position: relative; }
  .gallery-card-bg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 52px; transition: transform 0.5s ease; }
  .gallery-card:hover .gallery-card-bg { transform: scale(1.05); }
  .gallery-card-style { position: absolute; top: 10px; right: 10px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,241,235,0.9); background: rgba(28,28,26,0.4); padding: 4px 8px; backdrop-filter: blur(4px); }
  .gallery-card-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 300; font-style: italic; margin-bottom: 6px; }
  .gallery-card-meta { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.08em; color: var(--sand); }

  /* Feed */
  .feed-section { max-width: 1200px; margin: 0 auto; padding: 0 40px 80px; }
  .feed-header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; }
  .feed-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 7px 14px; font-family: inherit; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid rgba(28,28,26,0.15); background: transparent; color: #999; cursor: pointer; transition: all 0.2s; }
  .filter-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .filter-btn:hover:not(.active) { border-color: var(--moss); color: var(--moss); }
  .feed-masonry { columns: 4; column-gap: 16px; }
  .feed-card { break-inside: avoid; margin-bottom: 16px; background: #fff; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform 0.25s, box-shadow 0.25s; }
  .feed-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.1); }
  .feed-img { width: 100%; display: flex; align-items: center; justify-content: center; font-size: 52px; position: relative; }
  .feed-img-tall { aspect-ratio: 3/4; }
  .feed-img-wide { aspect-ratio: 4/3; }
  .feed-style-tag { position: absolute; top: 10px; right: 10px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,241,235,0.9); background: rgba(28,28,26,0.35); padding: 3px 8px; backdrop-filter: blur(4px); }
  .feed-body { padding: 16px; }
  .feed-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .feed-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--cream); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .feed-username { font-size: 11px; letter-spacing: 0.03em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-country { font-size: 9px; color: var(--sage); letter-spacing: 0.06em; }
  .feed-caption { font-size: 11px; line-height: 1.75; color: #555; margin-bottom: 10px; letter-spacing: 0.02em; }
  .feed-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .feed-tag { font-size: 9px; letter-spacing: 0.06em; color: var(--moss); cursor: pointer; transition: color 0.2s; }
  .feed-tag:hover { color: var(--ink); }
  .feed-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(28,28,26,0.06); }
  .feed-action { background: none; border: none; cursor: pointer; font-size: 10px; letter-spacing: 0.06em; color: #bbb; display: flex; align-items: center; gap: 4px; font-family: inherit; padding: 0; transition: color 0.2s; }
  .feed-action:hover { color: var(--moss); }
  .feed-action.liked { color: #c0392b; }
  .feed-time { font-size: 9px; color: #ccc; letter-spacing: 0.06em; }

  /* Shop */
  .shop-section { max-width: 1200px; margin: 0 auto; padding: 0 40px 80px; }
  .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(28,28,26,0.08); }
  .shop-card { background: #fff; cursor: pointer; transition: all 0.25s; }
  .shop-card-img { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 56px; transition: transform 0.4s ease; overflow: hidden; }
  .shop-card:hover .shop-card-img { transform: scale(1.04); }
  .shop-card-info { padding: 16px 20px 20px; }
  .shop-card-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; font-weight: 300; margin-bottom: 4px; }
  .shop-card-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .shop-card-style { font-size: 11px; color: #999; }
  .shop-card-price { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; }
  .shop-add-btn { margin-top: 12px; width: 100%; padding: 11px; background: var(--ink); color: var(--cream); border: none; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: background 0.2s; }
  .shop-add-btn:hover { background: var(--moss); }

  /* Footer */
  .footer { background: var(--ink); color: var(--cream); padding: 48px 40px 32px; }
  .footer-inner { max-width: 1200px; margin: 0 auto; }
  .footer-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 32px; margin-bottom: 40px; }
  .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; letter-spacing: 0.06em; margin-bottom: 10px; }
  .footer-logo em { font-style: italic; color: var(--sage); }
  .footer-tagline { font-size: 11px; color: #666; letter-spacing: 0.04em; line-height: 1.8; max-width: 280px; }
  .footer-links-group { display: flex; gap: 48px; flex-wrap: wrap; }
  .footer-col-title { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sand); margin-bottom: 14px; }
  .footer-link { font-size: 12px; color: #666; margin-bottom: 10px; cursor: pointer; letter-spacing: 0.04em; transition: color 0.2s; }
  .footer-link:hover { color: var(--cream); }
  .footer-bottom { padding-top: 24px; border-top: 1px solid rgba(244,241,235,0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .footer-copy { font-size: 10px; color: #444; letter-spacing: 0.08em; }

  /* Toast */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--ink); color: var(--cream); padding: 13px 22px; font-size: 11px; letter-spacing: 0.08em; z-index: 999; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }

  /* Responsive */
  @media (max-width: 900px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .feed-masonry { columns: 2; }
    .shop-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .nav { padding: 0 24px; }
    .nav-links { display: none; }
    .hamburger { display: flex; }
    .mobile-menu { display: block; }
    .hero { padding: 48px 24px 40px; }
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .hero-h1 { font-size: 44px; }
    .hero-visual { height: 300px; }
    .hero-stats { flex-wrap: wrap; gap: 20px; }
    .divider { padding: 0 24px; }
    .builder { padding: 0 24px 60px; }
    .builder-grid { grid-template-columns: 1fr; }
    .gallery-section { padding: 60px 24px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .feed-section { padding: 0 24px 60px; }
    .feed-masonry { columns: 2; }
    .feed-header { flex-direction: column; align-items: flex-start; }
    .shop-section { padding: 0 24px 60px; }
    .shop-grid { grid-template-columns: 1fr 1fr; }
    .footer { padding: 40px 24px 28px; }
    .section-h2 { font-size: 34px; }
  }
  @media (max-width: 480px) {
    .hero-h1 { font-size: 36px; }
    .feed-masonry { columns: 1; }
    .shop-grid { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const ASIA_FEED = [
  { user: "Hana Mori", handle: "@hanamori.terra", country: "🇯🇵 Kyoto", caption: "Morning mist in a bottle. Three months growing this hinoki forest. Worth every patient hour.", tags: ["#WabiSabi", "#MossTerrarium", "#KyotoGreen"], emoji: "🌲", bg: "linear-gradient(160deg,#2d3d2a,#4a5e3a,#6b7f5a)", likes: 1240, comments: 84, time: "2h ago", style: "Temperate Forest" },
  { user: "Rizal Azhari", handle: "@rizal.kebun", country: "🇲🇾 Kuala Lumpur", caption: "Humid jungle vibes right on my desk at KLCC. Fittonia & selaginella doing their thing.", tags: ["#TropicalTerrarium", "#KLGreen", "#TerraSquadMY"], emoji: "🌿", bg: "linear-gradient(160deg,#1a3a1a,#2d5a2a,#4a7a40)", likes: 876, comments: 52, time: "5h ago", style: "Tropical" },
  { user: "Chalisa P.", handle: "@chalisaplants", country: "🇹🇭 Bangkok", caption: "Desert meets monsoon. Cactus garden after the rain — this contrast never gets old.", tags: ["#DesertTerra", "#BKKPlants", "#AridGarden"], emoji: "🌵", bg: "linear-gradient(160deg,#5a4a2a,#8a6a3a,#c8a870)", likes: 1053, comments: 67, time: "8h ago", style: "Arid" },
  { user: "Seo Jiyeon", handle: "@jiyeon.micro", country: "🇰🇷 Seoul", caption: "First open terrarium. Haworthia cluster growing strong through winter. Clean lines only.", tags: ["#MinimalTerra", "#SeoulPlants", "#SugarGarden"], emoji: "🪨", bg: "linear-gradient(160deg,#3a3a3a,#5a5a4a,#8a8a7a)", likes: 2100, comments: 130, time: "12h ago", style: "Minimal" },
  { user: "Dian Puspita", handle: "@dianterrarium", country: "🇮🇩 Bandung", caption: "Aquatic paludarium — 6 months build. Golden mystery snails just arrived from the market.", tags: ["#Paludarium", "#AquaticTerra", "#BandungPlants"], emoji: "💧", bg: "linear-gradient(160deg,#1a2a3a,#2a4a5a,#3a7a7a)", likes: 1887, comments: 210, time: "1d ago", style: "Aquatic" },
  { user: "Wei Ling Tan", handle: "@weiling.jars", country: "🇸🇬 Singapore", caption: "Closed ecosystem day 90. Zero maintenance. The fog appears every morning like clockwork.", tags: ["#ClosedTerrarium", "#SGGarden", "#SelfSustaining"], emoji: "🫙", bg: "linear-gradient(160deg,#283828,#3d5c3a,#5a7a55)", likes: 3240, comments: 298, time: "1d ago", style: "Closed Ecosystem" },
  { user: "Aiko Tanaka", handle: "@aiko.miniworlds", country: "🇯🇵 Tokyo", caption: "Night garden terrarium. Added bioluminescent substrate. It glows after sundown 🌙", tags: ["#NightTerra", "#TokyoPlants", "#GlowGarden"], emoji: "🌙", bg: "linear-gradient(160deg,#0a0f0a,#1a2a1a,#2a3f2a)", likes: 4510, comments: 412, time: "2d ago", style: "Dark" },
  { user: "Ahmad Faris", handle: "@faris.terrarium", country: "🇲🇾 Penang", caption: "Penang hill moss — collected ethically and rehomed into this open bowl. Feels like home.", tags: ["#PenangPlants", "#MossArt", "#TerraSquadMY"], emoji: "🍀", bg: "linear-gradient(160deg,#2a3a1a,#4a5a2a,#6a7a4a)", likes: 654, comments: 41, time: "2d ago", style: "Moss" },
];

const GALLERY_ITEMS = [
  { name: "Mist & Fern", style: "Tropical", price: "RM 280", emoji: "🌿", bg: "linear-gradient(135deg,#c8ddb8,#8aaa70)" },
  { name: "Desert Calm", style: "Arid", price: "RM 195", emoji: "🌵", bg: "linear-gradient(135deg,#e8d8b8,#c8a870)" },
  { name: "Moss Kingdom", style: "Temperate", price: "RM 340", emoji: "🍀", bg: "linear-gradient(135deg,#b8d0a8,#7a9a60)" },
  { name: "Night Garden", style: "Dark", price: "RM 420", emoji: "🌙", bg: "linear-gradient(135deg,#2a3a2a,#4a5a3a)" },
  { name: "Aqua World", style: "Aquatic", price: "RM 580", emoji: "💧", bg: "linear-gradient(135deg,#1a2a4a,#3a7a7a)" },
  { name: "Stone Zen", style: "Minimal", price: "RM 165", emoji: "🪨", bg: "linear-gradient(135deg,#ccc,#888)" },
];

const ECOSYSTEMS = ["Tropical", "Desert", "Temperate", "Moss", "Aquatic", "Dark"];
const SIZES = ["Palm-sized", "Tabletop", "Statement", "Floor"];
const MOODS = ["Serene", "Wild", "Mystical", "Minimal", "Lush"];
const FILTERS = ["All", "🇲🇾 Malaysia", "🇯🇵 Japan", "🇰🇷 Korea", "🇮🇩 Indonesia", "🇸🇬 Singapore", "🇹🇭 Thailand"];

function App() {
  const [menuOpen, setMenuOpen] = useState(false);
  const [ecosystem, setEcosystem] = useState("");
  const [size, setSize] = useState("");
  const [mood, setMood] = useState("");
  const [extras, setExtras] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [toast, setToast] = useState("");
  const [feedFilter, setFeedFilter] = useState("All");
  const [liked, setLiked] = useState({});
  const [cart, setCart] = useState([]);
  const [visible, setVisible] = useState(false);

  useEffect(() => { setTimeout(() => setVisible(true), 100); }, []);

  const toggleLike = (i) => setLiked(p => ({ ...p, [i]: !p[i] }));

  const filteredFeed = feedFilter === "All"
    ? ASIA_FEED
    : ASIA_FEED.filter(p => p.country.includes(feedFilter.replace(/\S+\s/, "")));

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2800); };

  const scrollTo = (id) => { document.getElementById(id)?.scrollIntoView({ behavior: "smooth" }); setMenuOpen(false); };

  const addToCart = (name) => { setCart(p => [...p, name]); showToast(`"${name}" added to cart ✓`); };

  const generate = async () => {
    if (!ecosystem || !size || !mood) return;
    setLoading(true); setResult(null); setError("");
    const prompt = `You are TerraSquad's AI terrarium designer. Generate a custom terrarium design:
- Ecosystem: ${ecosystem}
- Size: ${size}
- Mood: ${mood}
- Notes: ${extras || "none"}

Reply ONLY with raw JSON, no markdown fences:
{"name":"2-3 word poetic name","description":"2 vivid sensory sentences","plants":[{"name":"Plant","role":"Role"},{"name":"Plant","role":"Role"},{"name":"Plant","role":"Role"}],"substrate":"substrate mix","care":"one care tip sentence","price":"RM number only e.g. 320","emoji":"single emoji","gradient":"CSS linear-gradient with earthy nature tones"}`;

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e?.error?.message || `Error ${res.status}`); }
      const data = await res.json();
      const text = data.content?.find(b => b.type === "text")?.text || "";
      setResult(JSON.parse(text.replace(/```json|```/g, "").trim()));
    } catch (e) {
      setError(e.message || "Something went wrong. Please try again.");
    }
    setLoading(false);
  };

  const canGenerate = ecosystem && size && mood;

  return (
    <div>
      {/* NAV */}
      <nav className="nav">
        <div className="nav-logo">Terra<em>Squad</em></div>
        <div className="nav-links">
          {[["Build","builder"],["Gallery","gallery"],["Community","community"],["Shop","shop"]].map(([l,id]) => (
            <button key={id} className="nav-link" onClick={() => scrollTo(id)}>{l}</button>
          ))}
          <button className="nav-cart" onClick={() => showToast(`Cart: ${cart.length} item${cart.length !== 1 ? "s" : ""}`)}>
            Cart{cart.length > 0 ? ` (${cart.length})` : ""}
          </button>
        </div>
        <button className="hamburger" onClick={() => setMenuOpen(o => !o)} aria-label="Menu">
          <span style={{ transform: menuOpen ? "rotate(45deg) translate(5px,5px)" : "none" }} />
          <span style={{ transform: menuOpen ? "scaleX(0)" : "none", opacity: menuOpen ? 0 : 1 }} />
          <span style={{ transform: menuOpen ? "rotate(-45deg) translate(5px,-5px)" : "none" }} />
        </button>
      </nav>

      {/* MOBILE MENU */}
      <div className="mobile-menu" style={{ maxHeight: menuOpen ? "260px" : "0" }}>
        {[["Build","builder"],["Gallery","gallery"],["Community","community"],["Shop","shop"]].map(([l,id]) => (
          <button key={id} onClick={() => scrollTo(id)}>{l}</button>
        ))}
      </div>

      {/* HERO */}
      <section className="hero">
        <div className="hero-grid">
          <div style={{ opacity: visible ? 1 : 0, transform: visible ? "none" : "translateY(24px)", transition: "all 0.9s ease" }}>
            <div className="hero-eyebrow">
              <span className="hero-eyebrow-line" />
              Asia's Terrarium Community
            </div>
            <h1 className="hero-h1">Living art,<br /><em>designed</em> by you.</h1>
            <p className="hero-p">TerraSquad is where terrarium culture meets creative community. Browse, build, and bring home miniature worlds crafted by AI and loved by collectors across Asia.</p>
            <div className="hero-btns">
              <button className="btn-primary" onClick={() => scrollTo("builder")}>Build yours →</button>
              <button className="btn-outline" onClick={() => scrollTo("gallery")}>Browse gallery</button>
            </div>
            <div className="hero-stats">
              {[["12K+","Community builds"],["8","Asian cities"],["AI","Powered designer"]].map(([n,l]) => (
                <div key={l}>
                  <div className="stat-num">{n}</div>
                  <div className="stat-label">{l}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="hero-visual" style={{ opacity: visible ? 1 : 0, transition: "opacity 1.1s ease 0.3s" }}>
            {[
              { emoji:"🌿", label:"Tropical", bg:"linear-gradient(135deg,#1a3a1a,#4a7a40)", cls:"float-1", top:"0%", left:"8%", w:"54%", h:"68%" },
              { emoji:"🌵", label:"Arid", bg:"linear-gradient(135deg,#5a4a2a,#c8a870)", cls:"float-2", top:"10%", left:"52%", w:"44%", h:"52%" },
              { emoji:"🌙", label:"Dark", bg:"linear-gradient(135deg,#0a0f0a,#2a3f2a)", cls:"float-3", top:"62%", left:"30%", w:"46%", h:"38%" },
            ].map((c,i) => (
              <div key={i} className={`hero-card ${c.cls}`} style={{ background: c.bg, top: c.top, left: c.left, width: c.w, height: c.h }}>
                <span className="hero-card-emoji">{c.emoji}</span>
                <div className="hero-card-label">{c.label}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* DIVIDER */}
      <div className="divider"><div className="divider-line" /><div className="divider-text">AI Builder</div><div className="divider-line" /></div>

      {/* BUILDER */}
      <section id="builder" className="builder">
        <div className="section-header">
          <h2 className="section-h2">Design your terrarium</h2>
          <p className="section-sub">Tell the AI what you want — it crafts a bespoke living world for you.</p>
        </div>
        <div className="builder-grid">
          {/* Form */}
          <div className="form-block">
            {[["Ecosystem", ECOSYSTEMS, ecosystem, setEcosystem], ["Size", SIZES, size, setSize], ["Mood", MOODS, mood, setMood]].map(([label, opts, val, setter]) => (
              <div className="form-group" key={label}>
                <div className="form-label">{label}</div>
                <div className="chip-group">
                  {opts.map(o => (
                    <button key={o} className={`chip${val === o ? " active" : ""}`} onClick={() => setter(o)}>{o}</button>
                  ))}
                </div>
              </div>
            ))}
            <div className="form-group">
              <div className="form-label">Anything else? <span style={{ color: "#bbb" }}>(optional)</span></div>
              <textarea className="form-textarea" value={extras} onChange={e => setExtras(e.target.value)}
                placeholder="e.g. I want it to look ancient, or I have a cylindrical jar..." />
            </div>
            {!canGenerate && <p className="hint-text">Select ecosystem, size, and mood to continue.</p>}
            <button className="generate-btn" onClick={generate} disabled={!canGenerate || loading}>
              {loading ? "Cultivating your design…" : "Generate design →"}
            </button>
          </div>

          {/* Result */}
          <div className="result-panel">
            <div className="result-header">
              <span className="result-title">Your Design</span>
              {result && <span className="result-badge">AI Generated ✦</span>}
            </div>
            <div className="result-body">
              {!loading && !result && !error && (
                <div className="empty-state">
                  <div className="empty-icon">🪴</div>
                  <p className="empty-text">Select your preferences and generate a custom terrarium design.</p>
                </div>
              )}
              {loading && (
                <div className="loading-state">
                  <div className="loading-dots">
                    <div className="loading-dot dot-1" />
                    <div className="loading-dot dot-2" />
                    <div className="loading-dot dot-3" />
                  </div>
                  <div className="loading-text">Growing your world…</div>
                </div>
              )}
              {error && !loading && <div className="error-box">{error}</div>}
              {result && !loading && (
                <div className="slide-up">
                  <div className="design-name">{result.name}</div>
                  <div className="design-visual" style={{ background: result.gradient || "linear-gradient(135deg,#dce8d0,#8fa880)" }}>
                    <span className="design-emoji">{result.emoji}</span>
                    <div className="design-tag">{ecosystem}</div>
                  </div>
                  <p className="design-desc">{result.description}</p>
                  <div className="form-label">Plant Selection</div>
                  <div className="plant-list">
                    {result.plants?.map((p,i) => (
                      <div className="plant-item" key={i}>
                        <span className="plant-name">{p.name}</span>
                        <span className="plant-role">{p.role}</span>
                      </div>
                    ))}
                    {result.substrate && (
                      <div className="plant-item">
                        <span className="plant-name">{result.substrate}</span>
                        <span className="plant-role">Substrate</span>
                      </div>
                    )}
                  </div>
                  {result.care && <div className="care-tip">💡 {result.care}</div>}
                  <div className="price-row">
                    <div>
                      <div className="price-label">Estimated Total</div>
                      <div className="price-amount">RM {result.price}</div>
                    </div>
                  </div>
                  <div className="action-row">
                    <button className="btn-cart" onClick={() => addToCart(result.name)}>Add to cart</button>
                    <button className="btn-save" onClick={() => showToast(`"${result.name}" saved ✓`)}>Save</button>
                  </div>
                  <button className="start-over" onClick={() => { setResult(null); setEcosystem(""); setSize(""); setMood(""); setExtras(""); }}>← Start over</button>
                </div>
              )}
            </div>
          </div>
        </div>
      </section>

      {/* GALLERY */}
      <section id="gallery" className="gallery-section">
        <div className="gallery-inner">
          <div className="gallery-top">
            <div>
              <h2 className="gallery-h2">Community Gallery</h2>
              <p className="gallery-sub">Designs loved by TerraSquad — browse, save, or purchase.</p>
            </div>
            <button className="btn-gold" onClick={() => showToast("Full gallery coming soon")}>View all →</button>
          </div>
          <div className="gallery-grid">
            {GALLERY_ITEMS.map((item, i) => (
              <div key={i} className="gallery-card" onClick={() => showToast(`Viewing "${item.name}"`)}>
                <div className="gallery-card-img">
                  <div className="gallery-card-bg" style={{ background: item.bg }}>{item.emoji}</div>
                  <div className="gallery-card-style">{item.style}</div>
                </div>
                <div className="gallery-card-name">{item.name}</div>
                <div className="gallery-card-meta"><span>{item.style}</span><span>{item.price}</span></div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* COMMUNITY */}
      <div className="divider" style={{ marginTop: "0" }}><div className="divider-line" /><div className="divider-text">Asia Community</div><div className="divider-line" /></div>

      <section id="community" className="feed-section">
        <div className="feed-header">
          <div>
            <h2 className="section-h2">From across Asia</h2>
            <p className="section-sub">Real builds. Real growers. One living community.</p>
          </div>
          <div className="feed-filters">
            {FILTERS.map(f => (
              <button key={f} className={`filter-btn${feedFilter === f ? " active" : ""}`} onClick={() => setFeedFilter(f)}>{f}</button>
            ))}
          </div>
        </div>
        <div className="feed-masonry">
          {filteredFeed.map((post, i) => (
            <div key={i} className="feed-card">
              <div className={`feed-img ${i % 3 === 1 ? "feed-img-wide" : "feed-img-tall"}`} style={{ background: post.bg }}>
                <span style={{ filter: "drop-shadow(0 4px 16px rgba(0,0,0,0.2))" }}>{post.emoji}</span>
                <div className="feed-style-tag">{post.style}</div>
              </div>
              <div className="feed-body">
                <div className="feed-user-row">
                  <div className="feed-avatar">{post.emoji}</div>
                  <div>
                    <div className="feed-username">{post.user}</div>
                    <div className="feed-country">{post.country}</div>
                  </div>
                </div>
                <p className="feed-caption">{post.caption}</p>
                <div className="feed-tags">{post.tags.map((t,j) => <span key={j} className="feed-tag">{t}</span>)}</div>
                <div className="feed-actions">
                  <div style={{ display:"flex", gap:"14px" }}>
                    <button className={`feed-action${liked[i] ? " liked" : ""}`} onClick={() => toggleLike(i)}>
                      {liked[i] ? "♥" : "♡"} {liked[i] ? post.likes + 1 : post.likes}
                    </button>
                    <button className="feed-action" onClick={() => showToast("Comments coming soon")}>◯ {post.comments}</button>
                  </div>
                  <span className="feed-time">{post.time}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* SHOP */}
      <div className="divider"><div className="divider-line" /><div className="divider-text">Shop</div><div className="divider-line" /></div>

      <section id="shop" className="shop-section">
        <div className="section-header">
          <h2 className="section-h2">Ready-made worlds</h2>
          <p className="section-sub">Hand-crafted terrariums, ship-ready across Malaysia.</p>
        </div>
        <div className="shop-grid">
          {GALLERY_ITEMS.map((item, i) => (
            <div key={i} className="shop-card">
              <div className="shop-card-img" style={{ background: item.bg }}>{item.emoji}</div>
              <div className="shop-card-info">
                <div className="shop-card-name">{item.name}</div>
                <div className="shop-card-row">
                  <span className="shop-card-style">{item.style}</span>
                  <span className="shop-card-price">{item.price}</span>
                </div>
                <button className="shop-add-btn" onClick={() => addToCart(item.name)}>Add to cart</button>
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* FOOTER */}
      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-top">
            <div>
              <div className="footer-logo">Terra<em>Squad</em></div>
              <p className="footer-tagline">Asia's home for terrarium culture. Build, share, and grow with a community that cares.</p>
            </div>
            <div className="footer-links-group">
              {[["Explore",["Gallery","Community","Builder"]],["Company",["About","Press","Careers"]],["Support",["FAQ","Shipping","Contact"]]].map(([sec,links]) => (
                <div key={sec}>
                  <div className="footer-col-title">{sec}</div>
                  {links.map(l => <div key={l} className="footer-link" onClick={() => showToast(`${l} — coming soon`)}>{l}</div>)}
                </div>
              ))}
            </div>
          </div>
          <div className="footer-bottom">
            <span className="footer-copy">© 2025 TerraSquad. All rights reserved.</span>
            <span className="footer-copy">Made with 🌿 across Asia</span>
          </div>
        </div>
      </footer>

      {/* TOAST */}
      {toast && <div className="toast toast-anim">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
